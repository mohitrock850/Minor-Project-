<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Nothing is loaded from the network. The Content-Security-Policy says so
      explicitly, so a stray <img src="http://..."> or an injected script cannot
      quietly reach out: this application works with the network unplugged, and
      the only outbound request in the whole product is the AI Assistant's call to
      api.openai.com, which is made by the backend, never by this page.

      connect-src allows http://localhost and http://127.0.0.1 (the local backend)
      plus http: on the LAN, because in HOST/CLIENT mode the API lives on another
      machine on the same network.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' http: https:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>University Timetable Management</title>
  </head>
  <body>
    <div id="root">
      <!-- Replaced as soon as React mounts; visible only while the bundle parses. -->
      <div class="boot">Loading&hellip;</div>
    </div>
    <script type="module" src="./main.jsx"></script>
  </body>
</html>
